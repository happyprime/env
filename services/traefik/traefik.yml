# Traefik static configuration.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    # .dev is HSTS-preloaded so browsers never send plain HTTP here anyway, but
    # curl and other tools do.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    # TLS for every router on this entrypoint, not only those that ask. Sites
    # ask anyway. Altis Local Server's S3, uploads, and Tachyon routers don't,
    # because its own proxy sets this same default.
    http:
      tls: {}

# Altis Local Server's nginx speaks HTTPS with a self-signed certificate. Sites
# are plain HTTP, so they never reach this.
serversTransport:
  insecureSkipVerify: true

api:
  dashboard: true

providers:
  # Sites are discovered from container labels — no per-project route files and
  # no host ports to allocate.
  docker:
    exposedByDefault: false
    network: hp-env
  # Loads the wildcard certificate (see dynamic/tls.yml).
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
